[workspace]
resolver = "2"
members = [
    "carbon_registry",
    "carbon_credit",
    "carbon_marketplace",
    "carbon_oracle",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies]
soroban-sdk = "21.0.0"
