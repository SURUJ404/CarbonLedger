version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: carbonledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: carbonledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://carbonledger:${POSTGRES_PASSWORD:-changeme}@postgres:5432/carbonledger
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ORACLE_SHARED_SECRET: ${ORACLE_SHARED_SECRET:-dev-oracle-secret}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

  oracle_verification:
    build: ./oracle
    command: ["python3", "verification_listener.py"]
    environment:
      BACKEND_URL: http://backend:3001/api/v1
      ORACLE_SHARED_SECRET: ${ORACLE_SHARED_SECRET:-dev-oracle-secret}
    depends_on:
      - backend

  oracle_price:
    build: ./oracle
    command: ["python3", "price_oracle.py"]
    environment:
      BACKEND_URL: http://backend:3001/api/v1
      ORACLE_SHARED_SECRET: ${ORACLE_SHARED_SECRET:-dev-oracle-secret}
    depends_on:
      - backend

  oracle_satellite:
    build: ./oracle
    command: ["python3", "satellite_monitor.py"]
    environment:
      BACKEND_URL: http://backend:3001/api/v1
      ORACLE_SHARED_SECRET: ${ORACLE_SHARED_SECRET:-dev-oracle-secret}
    ports:
      - "5001:5001"
    depends_on:
      - backend

volumes:
  pgdata:
